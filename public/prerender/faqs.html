            "name": "What is DocGenius?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "DocGenius is a native Salesforce application that transforms your Salesforce data into professional documents instantly. It works with both standard and custom objects, allowing you to create contracts, proposals, reports, and more without any coding."
            }
          },
          {
            "@type": "Question",
            "name": "How does DocGenius integrate with Salesforce?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "DocGenius is a 100% native Salesforce app, meaning it's installed directly in your Salesforce org. There's no external setup required - it works seamlessly with your existing data, objects, and security settings."
            }
          },
          {
            "@type": "Question",
            "name": "Can I use my own document templates?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Absolutely! You can create templates using our built-in editor, import existing Google Docs, or create new ones directly within the app. Our drag-and-drop interface makes it easy to design professional templates without any technical skills."
            }
          },
          {
            "@type": "Question",
            "name": "What file formats does DocGenius support?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "DocGenius supports multiple output formats including PDF, DOCX (Word), and CSV. You can also dynamically name your files based on record data for better organization."
            }
          },
          {
            "@type": "Question",
            "name": "Is there a limit on how many documents I can generate?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "With our Professional and Enterprise plans, you can generate unlimited documents. Our bulk generation feature can handle hundred of documents at once, and we even support exporting up to 1 million records to a single spreadsheet."
            }
          },
          {
            "@type": "Question",
            "name": "How secure is DocGenius?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "DocGenius follows Salesforce security best practices with role-based access control. You can configure Admin, Standard User, and Basic User roles to control who can create templates, generate documents, or access specific features."
            }
          },
          {
            "@type": "Question",
            "name": "Does DocGenius support electronic signatures?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes! DocGenius includes built-in digital signature functionality. You can send documents for signing, and signers get a user-friendly signature pad. Signed documents are automatically stored in your configured location."
            }
          },
          {
            "@type": "Question",
            "name": "Can I automate document generation?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Definitely! DocGenius integrates with Salesforce Flows, allowing you to trigger document generation automatically based on record changes or include it in your Screen Flows. You can also schedule recurring document generation."
