        <section id="faqs-page">
          <h2>Frequently Asked Questions — DocGenius</h2>
          <p>Find answers to common questions about DocGenius integration, setup, and features:</p>
          <dl>
            <dt>What is DocGenius?</dt>
            <dd>DocGenius is a native Salesforce application that transforms your Salesforce data into professional documents instantly. It works with both standard and custom objects, allowing you to create contracts, proposals, reports, and more without any coding.</dd>

            <dt>How does DocGenius integrate with Salesforce?</dt>
            <dd>DocGenius is a 100% native Salesforce app, meaning it's installed directly in your Salesforce org. There's no external setup required - it works seamlessly with your existing data, objects, and security settings.</dd>

            <dt>Can I use my own document templates?</dt>
            <dd>Absolutely! You can create templates using our built-in editor, import existing Google Docs, or create new ones directly within the app. Our drag-and-drop interface makes it easy to design professional templates without any technical skills.</dd>

            <dt>What file formats does DocGenius support?</dt>
            <dd>DocGenius supports multiple output formats including PDF, DOCX (Word), and CSV. You can also dynamically name your files based on record data for better organization.</dd>

            <dt>Is there a limit on how many documents I can generate?</dt>
            <dd>With our Professional and Enterprise plans, you can generate unlimited documents. Our bulk generation feature can handle hundreds of documents at once, and we even support exporting up to 1 million records to a single spreadsheet.</dd>

            <dt>How secure is DocGenius?</dt>
            <dd>DocGenius follows Salesforce security best practices with role-based access control. You can configure Admin, Standard User, and Basic User roles to control who can create templates, generate documents, or access specific features.</dd>

            <dt>Does DocGenius support electronic signatures?</dt>
            <dd>Yes! DocGenius includes built-in digital signature functionality. You can send documents for signing, and signers get a user-friendly signature pad. Signed documents are automatically stored in your configured location.</dd>

            <dt>Can I automate document generation?</dt>
            <dd>Definitely! DocGenius integrates with Salesforce Flows, allowing you to trigger document generation automatically based on record changes or include it in your Screen Flows. You can also schedule recurring document generation.</dd>
          </dl>
        </section>
