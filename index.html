        <h1>DocGenius — Salesforce-Native Automated Document Generation</h1>
        <p>DocGenius is an automated document generation software designed specifically to capture data from Salesforce instantly. From proposals and contracts to reports and letters, DocGenius makes the entire document journey fast, clean, and stress-free. Build templates once, map your fields using our intuitive no-code tools, and generate compliant documents in minutes.</p>

        <!-- Why Choose Section -->
        <section id="why-docgenius">
          <h2>Why Choose DocGenius?</h2>
          <p>Generate documents at Salesforce speed. Smarter, faster, and instantly. DocGenius offers a native integration to access data securely and performantly within your Salesforce environment, with no coding required.</p>
          <ul>
            <li><strong>Built for Salesforce:</strong> Native integration delivers seamless, high-performance document generation directly within your Salesforce environment.</li>
            <li><strong>No Coding Needed:</strong> Easily create professional documents with no technical expertise using simple and accessible drag-and-drop or copy-paste field mapping tools.</li>
            <li><strong>Scales with Your Business:</strong> Whether you're generating one document or millions, DocGenius handles your needs quickly and grows alongside your business.</li>
            <li><strong>Secure, Role-Based Access:</strong> Control document creation and maintain the security of your data within Salesforce.</li>
            <li><strong>User-Friendly &amp; Fast Setup:</strong> Get started instantly with an intuitive interface designed for quick setup and smooth operations.</li>
            <li><strong>Made for Real Users:</strong> Eliminate manual copy-paste errors, increase productivity, and streamline your document creation process.</li>
          </ul>
        </section>

        <!-- ── Features page content ─────────────────────────────────────── -->
        <section id="features-page">
          <h2>DocGenius — All Features &amp; Capabilities</h2>
          <p>DocGenius simplifies business document workflows with powerful features tailored for accuracy, scalability, and ease of use.</p>
          <ul>
            <li><strong>No-Code Template Builder:</strong> Create, customize, and manage document templates easily without requiring technical skills.</li>
            <li><strong>AI-Powered Document Generation:</strong> Create customized, ready-to-use documents in minutes. Simply add AI prompts and map Salesforce fields to pull the right data instantly.</li>
            <li><strong>Works with Standard &amp; Custom Objects:</strong> Pull data from any Salesforce object — standard or custom — ensuring your documents perfectly reflect your unique business records.</li>
            <li><strong>Easy Field Mapping:</strong> Map Salesforce fields to templates using drag-and-drop or copy-paste key fields for precision.</li>
            <li><strong>Live Preview &amp; Real-Time Editing:</strong> Instantly preview documents with real Salesforce data and make edits on the go.</li>
            <li><strong>Bulk &amp; Scheduled Generation:</strong> Automate document creation for hundreds of records with scheduled workflows.</li>
            <li><strong>Multiple Export Formats:</strong> Export documents in PDFs, DOCX, or CSV formats, flexible for any corporate workflow.</li>
            <li><strong>Built-In Digital Signature:</strong> Capture e-signatures electronically and store them securely within your document workflows.</li>
            <li><strong>Flow &amp; Automation Ready:</strong> Integrate DocGenius into Salesforce Flows, triggering instant automated document generation on record updates.</li>
          </ul>
        </section>

        <!-- ── User Guide page content ────────────────────────────────────── -->
        <section id="userguide-page">
          <h2>DocGenius User Guide &amp; Setup Documentation</h2>
          <p>DocGenius is designed to be easy to install, configure, and use. Below is an outline of the setup process detailed in the official User Guide:</p>
          <ol>
            <li><strong>Installation:</strong> Install the DocGenius package directly into your Salesforce Sandbox or Production environment.</li>
            <li><strong>Data Sources &amp; Mapping:</strong> Select standard or custom Salesforce objects. Map data fields using key mapping tags.</li>
            <li><strong>Template Configuration:</strong> Create templates with rich media support, tables, and conditional formatting.</li>
            <li><strong>Generate Button Setup:</strong> Configure custom buttons on page layouts to allow users to generate documents with a single click.</li>
            <li><strong>Automation:</strong> Hook document generation directly into Salesforce Flows and Apex Triggers for fully automated background processing.</li>
          </ol>
        </section>

        <!-- ── FAQs page content ──────────────────────────────────────────── -->
        <section id="faqs-page">
          <h2>Frequently Asked Questions — DocGenius</h2>
          <p>Find answers to common questions about DocGenius integration, setup, and features:</p>
          <dl>
            <dt>Is DocGenius native to Salesforce?</dt>
            <dd>Yes! DocGenius features a native integration that delivers seamless, secure, and high-performance document generation directly within your Salesforce organization.</dd>
            
            <dt>Do I need coding experience to build templates?</dt>
            <dd>Not at all. Our intuitive template builder is completely no-code. You can easily build, preview, and format document templates using drag-and-drop field mapping.</dd>
            
            <dt>What formats does DocGenius support?</dt>
            <dd>You can generate and export documents in multiple standard formats, including PDF, DOCX (Word), and CSV, fitting any corporate workflow.</dd>
            
            <dt>Does DocGenius support standard and custom Salesforce objects?</dt>
            <dd>Yes, you can pull data from any Salesforce object — both standard (like Leads, Accounts, Contacts, Cases) and custom objects.</dd>
            
            <dt>How does the AI-powered document generation work?</dt>
            <dd>Simply add AI prompts inside your template builder, and DocGenius will use smart Salesforce field mapping to fetch the correct data and construct tailored document copy dynamically.</dd>
          </dl>
        </section>
